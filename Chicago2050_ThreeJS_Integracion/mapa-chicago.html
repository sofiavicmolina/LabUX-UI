<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chicago — Mapa holográfico 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{ --cyan:#7AFF05; --green:#C2FF7A; --blue:#266610; --dim:rgba(122,255,5,.35); }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#07181E;color:var(--cyan);font-family:'Share Tech Mono',monospace}
  canvas{display:block}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:3;
      background:
        repeating-linear-gradient(0deg,rgba(122,255,5,.025) 0 1px,transparent 1px 3px),
        radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%);}
  #overlay{position:fixed;inset:0;pointer-events:none;z-index:4}
  #overlay svg{position:absolute;inset:0;width:100%;height:100%}
  .callout{position:absolute;top:0;left:0;padding:6px 10px 7px 10px;background:rgba(7,24,30,.55);border-left:2px solid currentColor;
           backdrop-filter:blur(2px);white-space:nowrap;font-size:11px;line-height:1.45;letter-spacing:.06em;
           text-shadow:0 0 6px currentColor}
  .callout::before{content:'';position:absolute;top:-1px;left:-2px;width:14px;height:1px;background:currentColor}
  .callout::after{content:'';position:absolute;bottom:-1px;right:0;width:30%;height:1px;background:currentColor;opacity:.6}
  .callout .t{font-family:'Orbitron',sans-serif;font-weight:700;font-size:13px;letter-spacing:.14em;margin-bottom:2px}
  .callout.big .t{font-size:22px;font-weight:900;letter-spacing:.22em}
  .callout .d{opacity:.78;font-size:10.5px}
  .callout.green{color:var(--green)} .callout.cyan{color:var(--cyan)} .callout.blue{color:#8fd14f}
  .callout.minor .t{font-size:11px}
  /* HUD */
  .hud{position:fixed;z-index:5;pointer-events:none;font-size:11px;letter-spacing:.08em}
  .tl{top:22px;left:26px}
  .tl .h{font-family:'Orbitron';font-weight:700;font-size:15px;letter-spacing:.3em;text-shadow:0 0 10px var(--cyan)}
  .tl .s{opacity:.6;margin-top:4px}
  .tr{top:22px;right:26px;text-align:right;min-width:220px}
  .tr .row{display:flex;justify-content:space-between;gap:18px;padding:3px 0;border-bottom:1px solid rgba(122,255,5,.15)}
  .tr .row b{color:var(--green);font-weight:400;text-shadow:0 0 6px var(--green)}
  .bars{display:flex;gap:2px;justify-content:flex-end;margin-top:8px;height:22px;align-items:flex-end}
  .bars i{width:5px;background:var(--cyan);opacity:.7;box-shadow:0 0 4px var(--cyan)}
  .bl{bottom:22px;left:26px;opacity:.5}
  .bl .word{font-family:'Orbitron';font-weight:900;font-size:clamp(40px,8vw,96px);letter-spacing:.18em;line-height:.9;
            color:transparent;-webkit-text-stroke:1px var(--cyan);text-shadow:0 0 18px rgba(122,255,5,.35)}
  .scale{display:flex;align-items:flex-end;gap:8px;margin-top:10px}
  .scale .bar{width:120px;height:8px;border:1px solid var(--cyan);border-top:none;position:relative}
  .scale .bar::before,.scale .bar::after{content:'';position:absolute;bottom:0;width:1px;height:5px;background:var(--cyan)}
  .scale .bar::before{left:25%}.scale .bar::after{left:50%}
  .br{bottom:22px;right:26px;text-align:right;opacity:.55;font-size:10.5px;line-height:1.6;max-width:300px}
  .corner{position:fixed;width:28px;height:28px;border:1.5px solid var(--cyan);z-index:5;opacity:.6;pointer-events:none}
  .c1{top:10px;left:10px;border-right:none;border-bottom:none}.c2{top:10px;right:10px;border-left:none;border-bottom:none}
  .c3{bottom:10px;left:10px;border-right:none;border-top:none}.c4{bottom:10px;right:10px;border-left:none;border-top:none}
  .ctrl{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:6;display:flex;gap:6px}
  .ctrl button{font:inherit;font-size:10.5px;letter-spacing:.14em;color:var(--cyan);background:rgba(7,24,30,.7);
               border:1px solid var(--dim);padding:6px 10px;cursor:pointer}
  .ctrl button:hover,.ctrl button.on{border-color:var(--cyan);box-shadow:0 0 10px rgba(122,255,5,.4);color:#fff}
  .blink{animation:bl 1.2s steps(2) infinite}@keyframes bl{50%{opacity:.2}}
  @media (max-width:760px){ .tr,.br{display:none} .callout.minor{display:none!important} .callout.big .t{font-size:16px} }
</style>
</head>

<div id="overlay"><svg id="lines"></svg><div id="labels"></div></div>
<div id="fx"></div>
<div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>

  <div class="s" id="sector" style="opacity:1;color:var(--green);text-shadow:0 0 6px var(--green);margin-top:8px">SECTOR: — (pasa el cursor sobre la ciudad)</div>
</div>

<div class="hud tr">
  <div class="row"><span>POPULATION</span><b>2.7M</b></div>

  <div class="row"><span>MEAN ELEV</span><b>181 M</b></div>

  <div class="bars" id="bars"></div>
</div>

<div class="hud bl">
  <div class="word">CHICAGO</div>
  <div class="scale"><div class="bar"></div><span>0 — 5 KM</span></div>
  <div style="margin-top:6px" id="cam">HDG 000° · ALT 000 · TILT 00°</div>
</div>

<div class="hud br" id="log"></div>

<div class="ctrl">
  <button id="bRot">AUTO-ORBIT</button>
  <button id="bLab" class="on">LABELS</button>
  <button id="bReset">RESET VIEW</button>
</div>

  [[41.854,-87.640],[41.830,-87.680],[41.800,-87.730],[41.790,-87.800]],                  // Archer
  [[41.880,-87.660],[41.850,-87.730]],                                                    // Ogden
  [[41.910,-87.635],[41.940,-87.665],[41.975,-87.693],[41.997,-87.710]],                  // Lincoln
  [[41.895,-87.631],[41.940,-87.650],[41.980,-87.668],[42.010,-87.672]],                  // Clark
  [[41.900,-87.660],[41.935,-87.700],[41.970,-87.745]],                                   // Elston
  [[41.835,-87.620],[41.780,-87.640],[41.720,-87.660]]                                    // Vincennes
];
DIAG.forEach(path=>{ for(let i=0;i<path.length-1;i++) clipSegment(P(...path[i]),P(...path[i+1]),g1,DEPTH+.05); });
const mkSeg=(arr,c,op)=>{ const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(arr,3)); return add(new THREE.LineSegments(g,lineMat(c,op))); };
mkSeg(g3,C_BLUE,.22); mkSeg(g2,C_CYAN,.28); mkSeg(g1,C_GREEN,.45);

// ---------- Ríos ----------
function river(pts,r){ const curve=new THREE.CatmullRomCurve3(pts.map(([a,b])=>{const v=P(a,b);return new THREE.Vector3(v.x,DEPTH+.12,v.y);}));
  add(new THREE.Mesh(new THREE.TubeGeometry(curve,120,r,6,false),new THREE.MeshBasicMaterial({color:0xc2ff7a,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false})));
  return curve; }
const riverCurve=river(RIVER_MAIN.concat(RIVER_N.slice(1)),0.28); river(RIVER_S,0.28); river(CALUMET,0.32);

// ---------- Lago Michigan ----------
const lakeShape=new THREE.Shape(GEO.lake.map(([x,z])=>new THREE.Vector2(x,-z)));
const lakeGeo=new THREE.ShapeGeometry(lakeShape); lakeGeo.rotateX(-Math.PI/2);
const lake=add(new THREE.Mesh(lakeGeo,new THREE.MeshBasicMaterial({color:0x266610,transparent:true,opacity:.55,depthWrite:false,blending:THREE.AdditiveBlending})));
lake.position.y=-0.35;
// línea de costa brillante + curvas batimétricas
const shoreV=SHORE_XZ.map(v=>new THREE.Vector3(v.x,.05,v.y));
add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(shoreV),lineMat(C_CYAN,1)));
const contours=[];
for(let k=1;k<=7;k++){ const off=k*3.2; const pts=shoreV.map(p=>new THREE.Vector3(p.x+off+Math.sin(p.z*.15+k)*.8,-.3,p.z)).filter(p=>p.x<60);
  const l=add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lineMat(C_BLUE,.45-k*.05)));
  contours.push(l); }
// Navy Pier
const np0=P(41.8917,-87.6140), np1=P(41.8917,-87.5990);
const pier=add(new THREE.Mesh(new THREE.BoxGeometry(np1.x-np0.x,.8,.7),new THREE.MeshBasicMaterial({color:0x7aff05,transparent:true,opacity:.55,blending:THREE.AdditiveBlending,depthWrite:false})));
pier.position.set((np0.x+np1.x)/2,.4,np0.y);

// ---------- Edificios ----------
const LOOP=P(41.8819,-87.6298);
const bPos=[], edges=[];
const rnd=(()=>{let s=1337;return()=>{s=(s*16807)%2147483647;return s/2147483647;};})();
function addBuilding(x,z,w,d,h){ bPos.push([x,z,w,d,h]);
  const y0=DEPTH, y1=DEPTH+h, xs=[x-w/2,x+w/2], zs=[z-d/2,z+d/2];
  const c=[[xs[0],zs[0]],[xs[1],zs[0]],[xs[1],zs[1]],[xs[0],zs[1]]];
  for(let i=0;i<4;i++){ const a=c[i],b=c[(i+1)%4]; edges.push(a[0],y1,a[1],b[0],y1,b[1], a[0],y0,a[1],a[0],y1,a[1]); } }
// Downtown denso
for(let i=0;i<300;i++){
  const x=LOOP.x-3.5+rnd()*6.2, z=LOOP.y-6+rnd()*9.5;
  if(!inCity(x,z)) continue;
  const d=Math.hypot(x-LOOP.x,z-(LOOP.y-1)); const h=(1.5+rnd()*9)*Math.exp(-d/4)+0.6;
  addBuilding(x,z,.35+rnd()*.45,.35+rnd()*.45,h);
}
// torres emblemáticas (estilizadas)
[[41.8789,-87.6359,22],[41.8988,-87.6229,17],[41.8889,-87.6265,16],[41.8858,-87.6215,15],[41.8826,-87.6233,14]].forEach(([a,b,h])=>{const v=P(a,b); addBuilding(v.x,v.y,.9,.9,h);});
const nearN=bPos.length;
// resto de la ciudad: baja altura
let tries=0; while(bPos.length<nearN+1700 && tries<20000){ tries++;
  const x=-55+rnd()*90, z=-55+rnd()*110; if(!inCity(x,z)) continue;
  const d=Math.hypot(x-LOOP.x,z-LOOP.y); if(d<6) continue;
  const h=0.25+rnd()*1.4*Math.exp(-d/30)+(rnd()<.03?rnd()*2.5:0);
  bPos.push([x,z,.3+rnd()*.5,.3+rnd()*.5,h]); }
const bGeo=new THREE.BoxGeometry(1,1,1); bGeo.translate(0,.5,0);
const bMesh=add(new THREE.InstancedMesh(bGeo,new THREE.MeshBasicMaterial({color:0x7aff05,transparent:true,opacity:.12,blending:THREE.AdditiveBlending,depthWrite:false}),bPos.length));
const m4=new THREE.Matrix4(), col=new THREE.Color();
bPos.forEach(([x,z,w,d,h],i)=>{ m4.makeScale(w,h,d); m4.setPosition(x,DEPTH,z); bMesh.setMatrixAt(i,m4);
  col.copy(h>6?C_GREEN:(h>2?C_CYAN:C_BLUE)).multiplyScalar(h>2?1:.8); bMesh.setColorAt(i,col); });
mkSeg(edges,C_CYAN,.32);

// ---------- Marcadores holográficos ----------
const beamMat=(color)=>new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
  uniforms:{uColor:{value:color},uTime:{value:0}},
  vertexShader:`varying float vY; void main(){ vY=uv.y; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`uniform vec3 uColor; uniform float uTime; varying float vY;
    void main(){ float a=pow(1.-vY,1.6)*.85*(.75+.25*sin(uTime*4.-vY*30.)); gl_FragColor=vec4(uColor*a,a); }`});
const markers=[], pulses=[];
function marker({lat,lon,color,h,beam=46,title,data,dx,dy,cls='',size=1}){
  const v=P(lat,lon), g=new THREE.Group(); g.position.set(v.x,DEPTH,v.y); add(g);
  const pil=new THREE.Mesh(new THREE.CylinderGeometry(.55*size,.75*size,h,6,1,true),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:.28,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
  pil.position.y=h/2; g.add(pil);
  const pe=new THREE.LineSegments(new THREE.EdgesGeometry(pil.geometry),lineMat(color,.95)); pe.position.copy(pil.position); g.add(pe);
  const cap=new THREE.Mesh(new THREE.OctahedronGeometry(.9*size,0),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,wireframe:true}));
  cap.position.y=h+1.4*size; g.add(cap);
  const bm=new THREE.Mesh(new THREE.CylinderGeometry(.18*size,.45*size,beam,12,1,true),beamMat(color));
  bm.position.y=h+beam/2; g.add(bm);
  for(let k=0;k<2;k++){ const r=new THREE.Mesh(new THREE.RingGeometry(1.2*size,1.45*size,48),
      new THREE.MeshBasicMaterial({color,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
    r.rotation.x=-Math.PI/2; r.position.y=.08; r.userData.phase=k*.5; g.add(r); pulses.push(r); }
  const el=document.createElement('div'); el.className='callout '+cls;
  el.innerHTML=`<div class="t">${title}</div>`+data.map(d=>`<div class="d">${d}</div>`).join('');
  document.getElementById('labels').appendChild(el);
  const ln=document.createElementNS('http://www.w3.org/2000/svg','polyline');
  ln.setAttribute('fill','none'); ln.setAttribute('stroke',el.classList.contains('green')?'#C2FF7A':(el.classList.contains('blue')?'#8fd14f':'#7AFF05'));
  ln.setAttribute('stroke-width','1'); ln.setAttribute('opacity','.85');
  const dot=document.createElementNS('http://www.w3.org/2000/svg','circle'); dot.setAttribute('r','3'); dot.setAttribute('fill','none');
  dot.setAttribute('stroke',ln.getAttribute('stroke'));
  document.getElementById('lines').append(ln,dot);
  markers.push({g,cap,bm,el,ln,dot,anchor:new THREE.Vector3(v.x,DEPTH+h+1.4*size,v.y),dx,dy});
}
const fmt=(a,b)=>`${a.toFixed(4)}°N  ${Math.abs(b).toFixed(4)}°W`;
marker({lat:41.8819,lon:-87.6278,color:C_GREEN,h:14,beam:60,size:1.3,cls:'green',dx:-330,dy:-40,
  title:'DOWNTOWN / THE LOOP',data:['DENSITY: 12.4K / KM²','TOWERS INDEXED: 312','LAT/LON '+fmt(41.8819,-87.6278)]});
marker({lat:41.8450,lon:-87.7050,color:C_CYAN,h:8,beam:70,size:1.5,cls:'cyan big',dx:-300,dy:-240,
  title:'CHICAGO',data:['POPULATION: 2.7M','AREA: 606 KM² · 77 COMMUNITY AREAS','GRID REF '+fmt(41.8781,-87.6298)]});
marker({lat:41.8800,lon:-87.5250,color:C_BLUE,h:3,beam:40,size:1.1,cls:'blue',dx:150,dy:-90,
  title:'LAKE MICHIGAN',data:['SURFACE TEMP: 11.4°C','MAX DEPTH: 281 M','SHORELINE SCAN: 100%']});
marker({lat:41.9786,lon:-87.9048,color:C_CYAN,h:6,beam:40,cls:'cyan minor',dx:-200,dy:-90,
  title:"O'HARE INTL",data:['FLIGHTS / HR: 128','NODE 03 · ONLINE']});
marker({lat:41.7868,lon:-87.7522,color:C_CYAN,h:5,beam:36,cls:'cyan minor',dx:-230,dy:40,
  title:'MIDWAY',data:['FLIGHTS / HR: 34','NODE 05 · ONLINE']});
marker({lat:41.8917,lon:-87.6043,color:C_GREEN,h:4,beam:34,cls:'green minor',dx:140,dy:10,
  title:'NAVY PIER',data:['VISITORS: 9.1M / YR']});
marker({lat:41.7886,lon:-87.5987,color:C_GREEN,h:5,beam:34,cls:'green minor',dx:120,dy:50,
  title:'HYDE PARK',data:['RESEARCH NODE 07','UPLINK 4.8 GB/S']});
marker({lat:41.9214,lon:-87.6513,color:C_CYAN,h:4,beam:30,cls:'cyan minor',dx:90,dy:-170,
  title:'LINCOLN PARK',data:['GREEN INDEX: 0.82']});
// etiqueta del río (sin pilar, ancla sobre el cauce)
const riverAnchor=riverCurve.getPoint(.55).clone().add(new THREE.Vector3(0,.4,0));
(()=>{ const el=document.createElement('div'); el.className='callout cyan minor';
  el.innerHTML='<div class="t">CHICAGO RIVER</div><div class="d">FLOW: 2.1 M/S · 3 BRANCHES</div>';
  document.getElementById('labels').appendChild(el);
  const ln=document.createElementNS('http://www.w3.org/2000/svg','polyline'); ln.setAttribute('fill','none'); ln.setAttribute('stroke','#7AFF05'); ln.setAttribute('opacity','.7');
  const dot=document.createElementNS('http://www.w3.org/2000/svg','circle'); dot.setAttribute('r','2.5'); dot.setAttribute('fill','#7AFF05');
  document.getElementById('lines').append(ln,dot);
  markers.push({el,ln,dot,anchor:riverAnchor,dx:-290,dy:60}); })();


// ---------- Barrio bajo el cursor ----------
const AREAS=GEO.areas.map(a=>({...a,poly:V2(a.p)}));
const hl=add(new THREE.Line(new THREE.BufferGeometry(),lineMat(C_GREEN,1))); hl.renderOrder=5;
const hlFill=add(new THREE.Mesh(new THREE.BufferGeometry(),new THREE.MeshBasicMaterial({color:0xc2ff7a,transparent:true,opacity:.18,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide})));
const sectorEl=document.getElementById('sector'); let curArea=null;
const ray=new THREE.Raycaster(), mpos=new THREE.Vector2();
renderer.domElement.addEventListener('pointermove',e=>{
  mpos.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(mpos,camera);
  const hit=ray.intersectObject(cityMesh)[0]; let a=null;
  if(hit) a=AREAS.find(ar=>inPoly(hit.point.x,hit.point.z,ar.poly));
  if(a===curArea) return; curArea=a;
  if(!a){ hl.visible=hlFill.visible=false; sectorEl.textContent='SECTOR: — (pasa el cursor sobre la ciudad)'; return; }
  const pts=a.poly.map(v=>new THREE.Vector3(v.x,DEPTH+.15,v.y)); pts.push(pts[0].clone());
  hl.geometry.dispose(); hl.geometry=new THREE.BufferGeometry().setFromPoints(pts); hl.visible=true;
  const sg=new THREE.ShapeGeometry(new THREE.Shape(a.poly.map(v=>new THREE.Vector2(v.x,-v.y)))); sg.rotateX(-Math.PI/2); sg.translate(0,DEPTH+.12,0);
  hlFill.geometry.dispose(); hlFill.geometry=sg; hlFill.visible=true;
  sectorEl.textContent=`SECTOR #${String(a.id).padStart(2,'0')}: ${a.n.toUpperCase()} · ${a.km2} KM²`;
});
// ---------- Partículas ----------
const PN=1600, pPos=new Float32Array(PN*3), pSpd=new Float32Array(PN);
for(let i=0;i<PN;i++){ const r=Math.sqrt(Math.random())*95, a=Math.random()*Math.PI*2;
  pPos[i*3]=Math.cos(a)*r; pPos[i*3+1]=Math.random()*60; pPos[i*3+2]=Math.sin(a)*r; pSpd[i]=.02+Math.random()*.06; }
const pGeo=new THREE.BufferGeometry(); pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
const dotTex=(()=>{ const c=document.createElement('canvas'); c.width=c.height=32; const x=c.getContext('2d');
  const g=x.createRadialGradient(16,16,0,16,16,16); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.4,'rgba(194,255,122,.5)'); g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g; x.fillRect(0,0,32,32); return new THREE.CanvasTexture(c); })();
add(new THREE.Points(pGeo,new THREE.PointsMaterial({size:.55,map:dotTex,color:0xc2ff7a,transparent:true,opacity:.75,blending:THREE.AdditiveBlending,depthWrite:false})));

// ---------- Flujos de datos (pulsos viajando por arterias) ----------
const flows=[];
for(let i=0;i<40;i++){
  const horiz=rnd()<.5, k=Math.round((rnd()-.5)*16)*4;
  const off=(horiz?ORIGIN.y:ORIGIN.x)+k*MILE/8;
  const m=new THREE.Mesh(new THREE.SphereGeometry(.22,8,8),new THREE.MeshBasicMaterial({color:rnd()<.5?0xc2ff7a:0x7aff05,blending:THREE.AdditiveBlending,transparent:true}));
  m.userData={horiz,off,t:rnd()*120-60,spd:(.08+rnd()*.15)*(rnd()<.5?1:-1)}; add(m); flows.push(m);
}

// ================== UI ==================
let showLabels=true;
document.getElementById('bRot').onclick=e=>{ controls.autoRotate=!controls.autoRotate; e.target.classList.toggle('on',controls.autoRotate); };
document.getElementById('bLab').onclick=e=>{ showLabels=!showLabels; e.target.classList.toggle('on',showLabels); };
document.getElementById('bReset').onclick=()=>{ camera.position.copy(HOME); controls.target.set(-8,0,2); };
const bars=document.getElementById('bars'); for(let i=0;i<22;i++){ bars.appendChild(document.createElement('i')); }
const logEl=document.getElementById('log'), LOGS=['SYNC GRID SECTOR','PING NODE','SCAN SHORELINE','UPDATE TRAFFIC MESH','RESOLVE CALLOUT','CACHE TILE','TRACE RIVER FLOW','HANDSHAKE UPLINK'];
const logLines=[]; setInterval(()=>{ const s=LOGS[Math.floor(Math.random()*LOGS.length)]+' '+String(Math.floor(Math.random()*999)).padStart(3,'0')+' ··· OK';
  logLines.push(s); if(logLines.length>6)logLines.shift(); logEl.innerHTML=logLines.join('<br>'); },900);

addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight); });

// ================== BUCLE ==================
const clock=new THREE.Clock(), v3=new THREE.Vector3();
const clockEl=document.getElementById('clock'), camEl=document.getElementById('cam'), nodesEl=document.getElementById('nodes'), fluxEl=document.getElementById('flux');
let frame=0;
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime(); frame++;
  controls.update();
  baseMat.uniforms.uTime.value=t;
  segRing.rotation.y=t*.05; tickRing.rotation.y=-t*.02;
  contours.forEach((c,i)=>c.material.opacity=(.4-i*.045)*(.6+.4*Math.sin(t*1.2-i*.6)));

  markers.forEach(m=>{ if(m.cap){ m.cap.rotation.y=t*1.2; m.cap.position.y=m.anchor.y-DEPTH+Math.sin(t*2+m.g.position.x)*.25; m.bm.material.uniforms.uTime.value=t; } });
  pulses.forEach(r=>{ const p=((t*.5+r.userData.phase)%1); r.scale.setScalar(1+p*3.5); r.material.opacity=(1-p)*.8; });

  const pa=pGeo.attributes.position.array;
  for(let i=0;i<PN;i++){ pa[i*3+1]+=pSpd[i]; if(pa[i*3+1]>60) pa[i*3+1]=0; }
  pGeo.attributes.position.needsUpdate=true;

  flows.forEach(f=>{ const u=f.userData; u.t+=u.spd; if(u.t>60)u.t=-60; if(u.t<-60)u.t=60;
    const x=u.horiz?u.t:u.off, z=u.horiz?u.off:u.t; f.visible=inCity(x,z); f.position.set(x,DEPTH+.25,z); });

  // callouts
  const W=innerWidth,H=innerHeight, placed=[];
  markers.forEach(m=>{
    v3.copy(m.anchor).project(camera);
    const vis=showLabels && v3.z<1 && Math.abs(v3.x)<1.05 && Math.abs(v3.y)<1.05;
    const sx=(v3.x*.5+.5)*W, sy=(-v3.y*.5+.5)*H;
    const narrow=W<760 && m.el.classList.contains('minor');
    if(!vis||narrow){ m.el.style.visibility='hidden'; m.ln.setAttribute('points',''); m.dot.setAttribute('r','0'); return; }
    let lx=sx+m.dx*(W<760?.55:1), ly=sy+m.dy*(W<760?.6:1);
    const bw=m.el.offsetWidth, bh=m.el.offsetHeight;
    lx=Math.max(14,Math.min(W-bw-14,lx)); ly=Math.max(70,Math.min(H-bh-70,ly));
    for(let it=0;it<12;it++){ const hit=placed.find(p=>lx<p.x+p.w+8 && lx+bw+8>p.x && ly<p.y+p.h+8 && ly+bh+8>p.y);
      if(!hit)break; ly=(sy<hit.y+hit.h/2)? hit.y-bh-10 : hit.y+hit.h+10; }
    placed.push({x:lx,y:ly,w:bw,h:bh});
    m.el.style.visibility='visible'; m.el.style.transform=`translate(${lx}px,${ly}px)`;
    const ex=m.dx<0?lx+bw:lx, ey=ly+bh;
    const elbowX=ex+(sx-ex)*.35;
    m.ln.setAttribute('points',`${sx},${sy} ${elbowX},${ey} ${ex},${ey}`);
    m.dot.setAttribute('cx',sx); m.dot.setAttribute('cy',sy); m.dot.setAttribute('r','3');
  });

  if(frame%6===0){
    const d=new Date(); clockEl.textContent=d.toISOString().slice(11,19)+' UTC · '+d.toISOString().slice(0,10);
    const off=camera.position.clone().sub(controls.target);
    const hdg=((Math.atan2(off.x,off.z)*180/Math.PI)+360)%360, tilt=90-Math.acos(off.y/off.length())*180/Math.PI;
    camEl.textContent=`HDG ${String(Math.round(hdg)).padStart(3,'0')}° · ALT ${String(Math.round(off.length()*0.4)).padStart(3,'0')} · TILT ${Math.round(tilt)}°`;
    nodesEl.textContent=String(4800+Math.floor(Math.sin(t*.3)*120+Math.random()*40)).padStart(4,'0');
    fluxEl.textContent=(2.4+Math.sin(t*.7)*.6+Math.random()*.1).toFixed(2)+' TB/S';
    [...bars.children].forEach((b,i)=>b.style.height=(4+Math.abs(Math.sin(t*2+i*.6))*18*Math.random()*.4+Math.abs(Math.sin(t+i*.3))*12)+'px');
  }
  composer.render();
}
animate();
</script>
